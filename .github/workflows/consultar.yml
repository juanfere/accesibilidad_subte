name: Consultar accesibilidad subte

# El schedule de cron cada 5' se sacó de acá: en runners compartidos de
# GitHub Actions los eventos `schedule` pueden demorarse bien por encima
# del intervalo pedido (o saltearse ejecuciones). Ahora la consulta
# periódica la dispara pg_cron dentro de Supabase, invocando la Edge
# Function `consultar` (ver supabase/functions/consultar y
# supabase/sql/cron_consultar.sql). Este workflow queda solo para correrlo
# a mano si hace falta debuggear con el script Python.
on:
  workflow_dispatch: {}

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python descargar.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
