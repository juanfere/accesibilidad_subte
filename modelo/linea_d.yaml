# Modelo de accesibilidad de la Línea D — BORRADOR A REVISAR
#
# Describe, para cada estación, los LUGARES (andenes, vestíbulos, salidas a la
# calle, puntos de combinación) y las CONEXIONES entre ellos que dependen de un
# medio de elevación. Se armó a mano leyendo los textos de la API de EMOVA y la
# tabla de escaleras del pedido de informes (Res. 145/2026). Ver analisis.md.
#
# Cómo leerlo:
#   lugares     tipo anden: "sentidos" = hacia dónde van los trenes que paran ahí
#               (dos sentidos = andén central o terminal; ninguno = fuera de uso).
#               "solo: llegada" / "solo: salida" = andén de terminal donde solo
#               se baja o solo se sube al tren.
#               tipo combinacion: si tiene "lugar", es ese mismo lugar de la
#               otra estación (permite llegar a la calle a través de otra línea).
#   conexiones  "equipo" es el código del medio en la API de EMOVA (campo nombre),
#               que es lo que permite cruzarlo con el estado en vivo.
#               "entre": se recorre en cualquier sentido (2 o más paradas).
#               "desde" -> "hasta": se recorre en un solo sentido.
#               "texto" es la descripción de EMOVA al momento de armar el mapa.
#   sin_ubicar  equipos que EMOVA informa pero cuyo recorrido no se conoce.
#   duda / dudas  lo que no se pudo determinar con las fuentes: REVISAR EN EL LUGAR.
#   nota        aclaración sobre de dónde salió el dato.
#   revisado    pasar a true cuando alguien que conoce la estación la validó.
#
# No figuran escaleras fijas, rampas ni desniveles: ninguna fuente los informa.

linea: D
cabeceras: [Catedral, Congreso de Tucumán]   # las estaciones van en este orden
estaciones:

  - nombre: "Catedral"
    categoria_oficial: b
    revisado: false
    dudas:
      - "Terminal con dos andenes: se asumió que el norte es de llegada y el sur de salida, porque un ascensor es 'solo hacia el exterior' y el otro 'solo ingreso'. CONFIRMAR."
    lugares:
      anden_norte: {tipo: "anden", sentidos: ["Catedral"], nombre: "Andén norte (de llegada)", solo: llegada}
      anden_sur: {tipo: "anden", sentidos: ["Congreso de Tucumán"], nombre: "Andén sur (de salida a Congreso de Tucumán)", solo: salida}
      salida_saenz_pena_534: {tipo: "calle", direccion: "Av. Roque Sáenz Peña 534"}
      salida_saenz_pena_567: {tipo: "calle", direccion: "Av. Roque Sáenz Peña 567"}
      salida_saenz_pena_florida: {tipo: "calle", direccion: "Av. Roque Sáenz Peña y Florida"}
    conexiones:
      - {equipo: "A1", medio: ascensor, desde: salida_saenz_pena_534, hasta: anden_sur,
         texto: "Ascensor N°1: Andén sur sentido Congreso de Tucumán - Av. Roque Sáenz Peña 534 (sólo ingreso)"}
      - {equipo: "A2", medio: ascensor, desde: anden_norte, hasta: salida_saenz_pena_567,
         texto: "Ascensor N° 2 Andén Norte - Sólo hacia el exterior: Av. Roque Sáenz Peña 567"}
      - {equipo: "E1", medio: escalera_mecanica, desde: anden_norte, hasta: salida_saenz_pena_florida,
         texto: "Escalera N°1: Andén - Av. Roque Sáenz Peña y Florida (Exterior)"}

