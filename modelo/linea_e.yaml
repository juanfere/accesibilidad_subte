# Modelo de accesibilidad de la Línea E — BORRADOR A REVISAR
#
# Describe, para cada estación, los LUGARES (andenes, vestíbulos, salidas a la
# calle, puntos de combinación) y las CONEXIONES entre ellos que dependen de un
# medio de elevación. Se armó a mano leyendo los textos de la API de EMOVA y la
# tabla de escaleras del pedido de informes (Res. 145/2026). Ver analisis.md.
#
# Cómo leerlo:
#   lugares     tipo anden: "sentidos" = hacia dónde van los trenes que paran ahí
#               (dos sentidos = andén central o terminal; ninguno = fuera de uso).
#               "solo: llegada" / "solo: salida" = andén de terminal donde solo
#               se baja o solo se sube al tren.
#               tipo combinacion: si tiene "lugar", es ese mismo lugar de la
#               otra estación (permite llegar a la calle a través de otra línea).
#   conexiones  "equipo" es el código del medio en la API de EMOVA (campo nombre),
#               que es lo que permite cruzarlo con el estado en vivo.
#               "entre": se recorre en cualquier sentido (2 o más paradas).
#               "desde" -> "hasta": se recorre en un solo sentido.
#               "texto" es la descripción de EMOVA al momento de armar el mapa.
#   sin_ubicar  equipos que EMOVA informa pero cuyo recorrido no se conoce.
#   duda / dudas  lo que no se pudo determinar con las fuentes: REVISAR EN EL LUGAR.
#   nota        aclaración sobre de dónde salió el dato.
#   revisado    pasar a true cuando alguien que conoce la estación la validó.
#
# No figuran escaleras fijas, rampas ni desniveles: ninguna fuente los informa.

linea: E
cabeceras: [Retiro, Plaza de los Virreyes]   # las estaciones van en este orden
estaciones:

  - nombre: "Retiro"
    categoria_oficial: a
    revisado: false
    dudas:
      - "Estación grande con muchos niveles. NO SABEMOS si el vestíbulo, la boletería y los pasillos están unidos a nivel: con los textos, los ascensores no forman un camino completo del andén a la calle."
      - "Según el pedido de informes, el ascensor N°2 está fuera de servicio desde 2023 por vandalismo."
    lugares:
      anden: {tipo: "anden", sentidos: ["Plaza de los Virreyes", "Retiro"], nombre: "Andén central (terminal)"}
      vestibulo_c: {tipo: "interior", nombre: "Vestíbulo del lado de la combinación con Línea C"}
      vestibulo_ffcc: {tipo: "interior", nombre: "Vestíbulo del lado de la conexión con el tren"}
      boleteria: {tipo: "interior", nombre: "Boletería"}
      hall_salidas_123: {tipo: "interior", nombre: "Hall de las salidas 1, 2 y 3"}
      hall_salidas_47: {tipo: "interior", nombre: "Hall de las salidas 4 y 7"}
      pasillo: {tipo: "interior", nombre: "Pasillo de salidas"}
      pasillo_comb_c: {tipo: "interior", nombre: "Pasillo de combinación con Línea C"}
      comb_c: {tipo: "combinacion", linea: "C", estacion: "Retiro", lugar: "anden", nombre: "Andén central de Retiro (Línea C)"}
      salida_libertador_100_s5: {tipo: "calle", direccion: "Av. del Libertador 100 (salida 5)"}
      salida_libertador_100_s3: {tipo: "calle", direccion: "Av. del Libertador 100 (salida 3)"}
      salida_juncal_601: {tipo: "calle", direccion: "Juncal 601"}
    conexiones:
      - {equipo: "A1", medio: ascensor, entre: [anden, vestibulo_c],
         texto: "Ascensor N°1: Andén Central - Vestíbulo - combinación con Línea C"}
      - {equipo: "A2", medio: ascensor, entre: [boleteria, salida_libertador_100_s5],
         texto: "Ascensor N°2: Boletería - Av Libertador 100 - Salida 5"}
      - {equipo: "A3", medio: ascensor, entre: [pasillo_comb_c, comb_c],
         texto: "Ascensor N°3: Pasillo de combinación con Línea C - Andén Central Línea C"}
      - {equipo: "E9", medio: escalera_mecanica, desde: anden, hasta: vestibulo_c,
         texto: "Escalera N°10: Andén - Vestíbulo (Lado Combinación con Línea C)"}
      - {equipo: "E7", medio: escalera_mecanica, desde: vestibulo_c, hasta: anden,
         texto: "Escalera N°9: Vestíbulo (Lado combinación con Línea C) - Andén Central"}
      - {equipo: "E8", medio: escalera_mecanica, desde: anden, hasta: vestibulo_ffcc,
         texto: "Escalera N°7: Andén Central - Vestíbulo (Lado conexión con FFCC)"}
      - {equipo: "E4", medio: escalera_mecanica, desde: vestibulo_ffcc, hasta: anden,
