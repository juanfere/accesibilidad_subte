# Modelo de accesibilidad de la Línea B — BORRADOR A REVISAR
#
# Describe, para cada estación, los LUGARES (andenes, vestíbulos, salidas a la
# calle, puntos de combinación) y las CONEXIONES entre ellos que dependen de un
# medio de elevación. Se armó a mano leyendo los textos de la API de EMOVA y la
# tabla de escaleras del pedido de informes (Res. 145/2026). Ver analisis.md.
#
# Cómo leerlo:
#   lugares     tipo anden: "sentidos" = hacia dónde van los trenes que paran ahí
#               (dos sentidos = andén central o terminal; ninguno = fuera de uso).
#               "solo: llegada" / "solo: salida" = andén de terminal donde solo
#               se baja o solo se sube al tren.
#               tipo combinacion: si tiene "lugar", es ese mismo lugar de la
#               otra estación (permite llegar a la calle a través de otra línea).
#   conexiones  "equipo" es el código del medio en la API de EMOVA (campo nombre),
#               que es lo que permite cruzarlo con el estado en vivo.
#               "entre": se recorre en cualquier sentido (2 o más paradas).
#               "desde" -> "hasta": se recorre en un solo sentido.
#               "texto" es la descripción de EMOVA al momento de armar el mapa.
#   sin_ubicar  equipos que EMOVA informa pero cuyo recorrido no se conoce.
#   duda / dudas  lo que no se pudo determinar con las fuentes: REVISAR EN EL LUGAR.
#   nota        aclaración sobre de dónde salió el dato.
#   revisado    pasar a true cuando alguien que conoce la estación la validó.
#
# No figuran escaleras fijas, rampas ni desniveles: ninguna fuente los informa.

linea: B
cabeceras: [Leandro N. Alem, Juan Manuel de Rosas]   # las estaciones van en este orden
estaciones:

  - nombre: "Leandro N. Alem"
    categoria_oficial: a
    revisado: false
    dudas:
      - "No tiene ascensor propio: es accesible por el ascensor que une su andén con el de Correo Central (Línea E). Ese ascensor figura en el mapa de la Línea E."
    lugares:
      anden: {tipo: "anden", sentidos: ["Juan Manuel de Rosas", "Leandro N. Alem"], nombre: "Andén central (terminal)"}
      vestibulo: {tipo: "interior", nombre: "Vestíbulo / hall boletería"}
      salida_corrientes_161: {tipo: "calle", direccion: "Av. Corrientes 161"}
    conexiones:
      - {equipo: "EInt", medio: escalera_mecanica, desde: anden, hasta: vestibulo,
         texto: "Escalera N°1: Andén - Vestíbulo"}
      - {equipo: "EExt", medio: escalera_mecanica, desde: vestibulo, hasta: salida_corrientes_161,
         texto: "Escalera N°2 (exterior): Vestíbulo - Av. Corrientes 161"}

